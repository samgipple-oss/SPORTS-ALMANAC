
name: Update Sports Almanac fixtures

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */3 * * *"

permissions:
  contents: write

concurrency:
  group: sports-almanac-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect fixtures and match TV listings
        env:
          XMLTV_URL: ${{ secrets.XMLTV_URL }}
        run: python scripts/update_fixtures.py

      - name: Commit refreshed fixture database
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sports-fixtures.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update fixtures and broadcast matches"
            git push
          fi
